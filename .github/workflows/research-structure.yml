name: Research structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  atlas-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate atlas structure
        run: python3 scripts/audit_atlas.py
      - name: Check portfolio map freshness
        run: python3 scripts/build_portfolio_map.py --check
      - name: Compile validation scripts
        run: python3 -m compileall -q scripts
      - name: Check patch whitespace
        run: git diff --check
