name: Research structure

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  atlas-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate atlas structure
        run: python3 scripts/audit_atlas.py
